<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Black Hole — 10-second NEXORA Studio fidelity fixture</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02030c}
    #universe{position:absolute;inset:0;width:100%;height:100%;display:block}
    .hud{position:absolute;left:3%;bottom:7%;font:600 13px system-ui,sans-serif;
      letter-spacing:.18em;color:#c2b6a1;text-shadow:0 0 12px #df7c35aa;
      animation:glow 10s ease-in-out infinite;pointer-events:none}
    @keyframes glow{0%{opacity:.3;transform:translateY(2px)}
      50%{opacity:1;transform:translateY(-5px)}100%{opacity:.3;transform:translateY(2px)}}
  </style>
</head>
<body>
  <canvas id="universe" aria-label="Animated WebGL black hole with accretion disk"></canvas>
  <div class="hud">SINGULARITY / SIMULATION</div>
  <script>
    (()=>{
      const canvas=document.getElementById('universe');
      canvas.width=Math.max(2,innerWidth);
      canvas.height=Math.max(2,innerHeight);
      const gl=canvas.getContext('webgl2',{alpha:false,antialias:true});
      if(!gl)throw new Error('This black-hole fixture requires WebGL2.');
      const vertex='#version 300 es\nin vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
      const fragment='#version 300 es\n'+
      'precision highp float;uniform vec2 res;uniform float tm;out vec4 color;\n'+
      'void main(){vec2 p=(gl_FragCoord.xy-.5*res)/res.y;'+
      'float r=length(p);float a=atan(p.y,p.x);'+
      'float waves=.5+.5*sin(a*8.-tm*1.7+r*36.);'+
      'float disk=exp(-pow((r-.255)/.054,2.));'+
      'float lens=exp(-pow((r-.173)/.012,2.));'+
      'float pulse=.77+.23*sin(tm*1.13+a*4.);'+
      'vec3 warm=mix(vec3(.92,.16,.018),vec3(1.,.8,.19),waves);'+
      'vec3 sky=vec3(.004,.006,.022)+vec3(.015,.011,.05)*(1.-smoothstep(.25,.9,r));'+
      'vec3 c=sky+disk*warm*pulse*1.36+lens*vec3(.16,.40,.96)*(.6+.4*waves);'+
      'float horizon=1.-smoothstep(.115,.14,r);c=mix(c,vec3(.001,.001,.003),horizon);'+
      'color=vec4(clamp(c,0.,1.),1.);}\n';
      function compile(type,src){
        const shader=gl.createShader(type);gl.shaderSource(shader,src);gl.compileShader(shader);
        if(!gl.getShaderParameter(shader,gl.COMPILE_STATUS))
          throw Error('Black-hole shader compile: '+gl.getShaderInfoLog(shader));
        return shader;
      }
      const program=gl.createProgram();
      gl.attachShader(program,compile(gl.VERTEX_SHADER,vertex));
      gl.attachShader(program,compile(gl.FRAGMENT_SHADER,fragment));
      gl.linkProgram(program);
      if(!gl.getProgramParameter(program,gl.LINK_STATUS))
        throw Error('Black-hole shader link: '+gl.getProgramInfoLog(program));
      gl.useProgram(program);
      const coords=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,coords);
      gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
      const p=gl.getAttribLocation(program,'p');gl.enableVertexAttribArray(p);
      gl.vertexAttribPointer(p,2,gl.FLOAT,false,0,0);
      gl.uniform2f(gl.getUniformLocation(program,'res'),canvas.width,canvas.height);
      const time=gl.getUniformLocation(program,'tm');
      function render(ms){
        gl.viewport(0,0,canvas.width,canvas.height);
        gl.uniform1f(time,ms/1000);
        gl.drawArrays(gl.TRIANGLES,0,3);
        requestAnimationFrame(render);
      }
      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
