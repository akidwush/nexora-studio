# Temporary, branch-scoped lockfile bootstrap. Deleted after the checked-in lock is verified.
name: Bootstrap patched dependency lock
on:
  push:
    branches: [studio-step2-video]
    paths:
      - package.json
      - .github/workflows/security-bootstrap.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  create-lock:
    if: github.ref == 'refs/heads/studio-step2-video'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Generate exact dependency lock (no install scripts)
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate lock matches patched Vite
        run: |
          node -e "const p=require('./package-lock.json'); if(p.packages['node_modules/vite'].version!=='7.3.6')process.exit(1)"
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Commit lock only to approved work branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'build(security): lock patched Vite dependencies'
            git push origin HEAD:studio-step2-video
          fi
