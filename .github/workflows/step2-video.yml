name: Step 2 - Native video renderer
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  step2-video:
    runs-on: ubuntu-latest
    timeout-minutes: 34
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproducible install with committed lock
        run: npm ci --no-fund
      - name: Deterministic rendering unit tests
        run: npm test
      - name: Fetch pinned Studio Pro upstream with notices
        run: npm run studio:sync
      - name: Build NEXORA and upstream editor
        run: npm run build:full
      - name: Verify separate app assets and licenses
        run: node scripts/verify-full-build.mjs
      - name: Verify pinned upstream public-ingress quarantine and write static audit JSON
        run: node scripts/verify-studio-public-ingress.mjs
      - name: Record pinned upstream npm security advisories (public imports remain disabled)
        run: node scripts/report-studio-upstream-dependencies.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium chrome
      - name: Security regression - original Studio Pro HTML code on opaque origin
        run: node tests/studio-pro-isolation.browser.mjs
      - name: Security regression - malicious project and legacy monolithic renderer routes
        run: node tests/studio-pro-ingress.browser.mjs
      - name: Security regression - secondary uploads and invalid media cannot mutate state
        run: node tests/studio-pro-secondary-assets.browser.mjs
      - name: Step 1 regression browser suite
        run: npm run test:browser
      - name: Step 2 actual MP4 encode/decode + mobile checks
        run: node tests/video.browser.mjs
      - name: Step 4 local drafts, mock server AI and real MP4 browser QA
        run: npm run test:ai-browser
      - name: Step 1 isolated HTML/CSS/SVG/JS browser security checks
        run: node tests/html-sandbox.browser.mjs
      - name: Step 2 deterministic HTML timeline browser regression
        run: node tests/html-clock.browser.mjs
      - name: Real HTML/CSS/SVG/JS frame capture and 30/60 FPS MP4 integration
        run: node tests/html-video.browser.mjs
      - name: Preview-export visual fidelity and transparency regression
        run: node tests/html-fidelity.browser.mjs
      - name: Stage A+B multi-effect and OPFS streaming Chrome fidelity matrix
        run: node tests/html-render-matrix.browser.mjs
      - name: Experimental complete HTML + WebGL + pinned Three.js real Chrome MP4
        run: node tests/full-document.browser.mjs
      - name: Independent FFprobe validation of 5s real streamed Android MP4
        run: |
          command -v ffprobe >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
          node scripts/verify-android-mp4.mjs artifacts/android-webgl-five-seconds-stream.mp4
      - name: Upload passing static build for preview, no deployment
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-studio-step2-static-preview
          path: dist/
          retention-days: 7
      - name: Upload distinct patched Studio Pro build (dedicated host only)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: studio-pro-isolated-host-only
          path: dist-studio-pro/
          retention-days: 7
      - name: Upload desktop and mobile QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-studio-step2-screenshots
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
