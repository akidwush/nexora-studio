name: Ten-second cinematic renderer
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cinematic-10s:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locked dependencies
        run: npm ci --no-fund
      - name: Unit validation for 10s bitrate, streaming and frame coverage
        run: node --test tests/html-video.test.mjs tests/android-mp4.test.mjs
      - name: Typecheck and production build
        run: npm run build
      - name: Install real browser and FFprobe dependencies
        run: |
          npx playwright install --with-deps chromium chrome
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
      - name: Export, decode and visually verify complete 10s black-hole HTML
        run: node tests/cinematic-black-hole.browser.mjs
      - name: Publish independent encoded movie and screenshots for manual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-cinematic-black-hole-10s-proof
          path: |
            artifacts/studio-black-hole-10-seconds.mp4
            artifacts/black-hole-10s-studio-ui.png
          retention-days: 7
          if-no-files-found: ignore
